<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrumpetScan AI - Motor Calibrado</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #1a1a24;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #252632;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid #333547;
        }
        h1 { color: #f39c12; font-size: 28px; }
        .btn-ia {
            background-color: #f39c12;
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(243, 156, 18, 0.2);
            transition: 0.3s;
        }
        .btn-ia:hover { background-color: #e67e22; }
        #textoProgreso { color: #27ae60; font-size: 16px; margin-top: 10px; font-weight: bold; }
        #resultado-final {
            margin-top: 25px;
            padding: 20px;
            background: #1e1f29;
            border: 2px dashed #333547;
            border-radius: 12px;
            min-height: 100px;
            text-align: center;
        }
        .nota-real {
            display: inline-block;
            background: #27ae60; /* Verde para notas estables verificadas */
            color: white;
            padding: 12px 20px;
            margin: 6px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 24px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎺 TrumpetScan AI</h1>
        <p style="color: #b2bec3;">Filtro de Armónicos Activo. Diseñado para limpiar ruidos y captar notas melódicas estables.</p>
        
        <input type="file" id="archivoAudio" accept="audio/*" style="display:none;">
        <button class="btn-ia" onclick="document.getElementById('archivoAudio').click()">🎵 Analizar Punteo Limpio</button>
        
        <p id="textoProgreso"></p>
        
        <div id="resultado-final">
            <p style="color: #7f8c8d;">El análisis de alta fidelidad aparecerá aquí...</p>
        </div>
    </div>

    <script>
        // Tabla de transposición exacta a Si Bemol (Bb) para trompeta
        const NOTAS_TROM_Bb = ["Re", "Re#", "Mi", "Fa", "Fa#", "Sol", "Sol#", "La", "La#", "Do", "Do#", "Si"];

        document.getElementById('archivoAudio').addEventListener('change', async function(evento) {
            const archivo = evento.target.files[0];
            if (!archivo) return;

            const textoProgreso = document.getElementById('textoProgreso');
            const resultadoDiv = document.getElementById('resultado-final');

            textoProgreso.textContent = "🔬 Filtrando armónicos y estabilizando tono... Espera.";
            resultadoDiv.innerHTML = "";

            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const arrayBuffer = await archivo.arrayBuffer();
                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                
                const datosCanal = audioBuffer.getChannelData(0);
                const sampleRate = audioBuffer.sampleRate;
                
                const tamañoVentana = 2048; 
                let historialCrudo = [];

                // 1. ESCANEO INICIAL DE TODAS LAS FRECUENCIAS
                for (let i = 0; i < datosCanal.length; i += tamañoVentana) {
                    const fragmento = datosCanal.subarray(i, i + tamañoVentana);
                    const frecuencia = autoCorrelacionAvanzada(fragmento, sampleRate);

                    // Capturamos el rango real de frecuencias de la guitarra/trompeta
                    if (frecuencia > 120 && frecuencia < 1000) {
                        const midi = Math.round(12 * Math.log2(frecuencia / 440)) + 69;
                        const nombreNota = NOTAS_TROM_Bb[midi % 12];
                        historialCrudo.push(nombreNota);
                    } else {
                        historialCrudo.push("Silencio");
                    }
                }

                // 2. FILTRO ANTI-RUIDO DE ALTA INTENSIDAD
                // Una nota debe durar estable en el tiempo para ser considerada real
                let notasLimpias = [];
                let notaActual = "";
                let rachaActual = 0;

                for (let i = 0; i < historialCrudo.length; i++) {
                    if (historialCrudo[i] === notaActual) {
                        rachaActual++;
                    } else {
                        // CALIBRACIÓN COMERCIAL: Exigimos que la nota se mantenga firme durante al menos
                        // 6 bloques seguidos (aprox 0.25 segundos) para descartar armónicos fantasma
                        if (rachaActual >= 6 && notaActual !== "Silencio" && notaActual !== "") {
                            notasLimpias.push(notaActual);
                        }
                        notaActual = historialCrudo[i];
                        rachaActual = 1;
                    }
                }
                // Añadir la última nota detectada si cumple el filtro
                if (rachaActual >= 6 && notaActual !== "Silencio" && notaActual !== "") {
                    notasLimpias.push(notaActual);
                }

                // 3. RENDERIZAR RESULTADO FINAL LIMPIO
                textoProgreso.textContent = "✅ Escaneo e inmunidad de armónicos finalizada.";
                if (notasLimpias.length === 0) {
                    resultadoDiv.innerHTML = "<p style='color:#e74c3c;'>No se detectaron notas lo suficientemente largas o estables. ¡Intenta tocar el punteo un poco más lento o definido!</p>";
                } else {
                    let html = `<h3>🎶 Melodía Real Verificada (Trompeta Bb):</h3><br>`;
                    notasLimpias.forEach(nota => {
                        html += `<span class="nota-real">${nota}</span>`;
                    });
                    resultadoDiv.innerHTML = html;
                }

            } catch (error) {
                textoProgreso.textContent = "❌ Error en el motor de audio.";
                console.error(error);
            }
        });

        // Algoritmo matemático autocorrelativo reforzado
        function autoCorrelacionAvanzada(buffer, sampleRate) {
            const SIZE = buffer.length;
            let r = new Float32Array(SIZE);
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE - i; j++) {
                    r[i] = r[i] + buffer[j] * buffer[j + i];
                }
            }
            let d = 0;
            while (r[d] > r[d + 1]) d++;
            let maxval = -1, maxpos = -1;
            for (let i = d; i < SIZE; i++) {
                if (r[i] > maxval && r[i] > r[i - 1] && r[i] > r[i + 1]) {
                    maxval = r[i];
                    maxpos = i;
                    break;
                }
            }
            if (maxpos !== -1) return sampleRate / maxpos;
            return -1;
        }
    </script>
</body>
</html>
