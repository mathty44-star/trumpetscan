<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrumpetScan AI - Motor Real</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #1a1a24;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #252632;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid #333547;
        }
        h1 { color: #f39c12; font-size: 28px; }
        .btn-ia {
            background-color: #f39c12;
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(243, 156, 18, 0.2);
            transition: 0.3s;
        }
        .btn-ia:hover { background-color: #e67e22; }
        #textoProgreso { color: #27ae60; font-size: 16px; margin-top: 10px; font-weight: bold; }
        #resultado-final {
            margin-top: 25px;
            padding: 20px;
            background: #1e1f29;
            border: 2px dashed #333547;
            border-radius: 12px;
            min-height: 100px;
            text-align: center;
        }
        .nota-real {
            display: inline-block;
            background: #f39c12;
            color: white;
            padding: 10px 18px;
            margin: 6px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 24px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎺 TrumpetScan AI</h1>
        <p style="color: #b2bec3;">Escáner de frecuencia real. Sube un punteo limpio y extrae las notas transpuestas (Bb).</p>
        
        <input type="file" id="archivoAudio" accept="audio/*" style="display:none;">
        <button class="btn-ia" onclick="document.getElementById('archivoAudio').click()">🎵 Analizar Punteo Real</button>
        
        <p id="textoProgreso"></p>
        
        <div id="resultado-final">
            <p style="color: #7f8c8d;">Las notas reales calculadas aparecerán aquí...</p>
        </div>
    </div>

    <script>
        // Sistema de notas internacionales transposicionadas para trompeta Bb (+2 semitonos)
        const NOTAS_TROM_Bb = ["Re", "Re#", "Mi", "Fa", "Fa#", "Sol", "Sol#", "La", "La#", "Do", "Do#", "Si"];

        document.getElementById('archivoAudio').addEventListener('change', async function(evento) {
            const archivo = evento.target.files[0];
            if (!archivo) return;

            const textoProgreso = document.getElementById('textoProgreso');
            const resultadoDiv = document.getElementById('resultado-final');

            textoProgreso.textContent = "⏳ Decodificando ondas de sonido... Por favor espera.";
            resultadoDiv.innerHTML = "";

            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const arrayBuffer = await archivo.arrayBuffer();
                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                
                const datosCanal = audioBuffer.getChannelData(0); // Canal principal mono
                const sampleRate = audioBuffer.sampleRate;
                
                const tamañoVentana = 2048; // Fragmento de análisis
                let notasCalculadas = [];

                // Recorremos todo el archivo de audio real buscando los Hz
                for (let i = 0; i < datosCanal.length; i += tamañoVentana) {
                    const fragmento = datosCanal.subarray(i, i + tamañoVentana);
                    const frecuencia = autoCorrelacionReal(fragmento, sampleRate);

                    // Filtro de rango de melodía de trompeta común (ej. de 140Hz a 1000Hz)
                    if (frecuencia > 130 && frecuencia < 1100) {
                        // Fórmula física para transformar Hz a la escala musical de 12 notas
                        const midi = Math.round(12 * Math.log2(frecuencia / 440)) + 69;
                        
                        // Obtenemos la nota transpuesta directa de nuestra lista (+2 semitonos integrada)
                        const nombreNota = NOTAS_TROM_Bb[midi % 12];

                        // Filtro de estabilidad: Evitamos amontonar notas duplicadas idénticas en milisegundos
                        if (notasCalculadas.length === 0 || notasCalculadas[notasCalculadas.length - 1] !== nombreNota) {
                            notasCalculadas.push(nombreNota);
                        }
                    }
                }

                // Imprimimos el resultado limpio en la pantalla
                textoProgreso.textContent = "✅ ¡Punteo escaneado de forma matemática!";
                if (notasCalculadas.length === 0) {
                    resultadoDiv.innerHTML = "<p style='color:#e74c3c;'>El audio es muy bajo o tiene mucho ruido. ¡Asegúrate de que el punteo se escuche fuerte!</p>";
                } else {
                    let html = `<h3>🎶 Notas Reales para tu Trompeta:</h3><br>`;
                    notasCalculadas.forEach(nota => {
                        html += `<span class="nota-real">${nota}</span>`;
                    });
                    resultadoDiv.innerHTML = html;
                }

            } catch (error) {
                textoProgreso.textContent = "❌ Error al procesar.";
                console.error(error);
            }
        });

        // Algoritmo YIN simplificado para captar el tono fundamental exacto del instrumento
        function autoCorrelacionReal(buffer, sampleRate) {
            const SIZE = buffer.length;
            let r = new Float32Array(SIZE);
            
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE - i; j++) {
                    r[i] = r[i] + buffer[j] * buffer[j + i];
                }
            }

            let d = 0;
            while (r[d] > r[d + 1]) d++;
            
            let maxval = -1, maxpos = -1;
            for (let i = d; i < SIZE; i++) {
                if (r[i] > maxval && r[i] > r[i - 1] && r[i] > r[i + 1]) {
                    maxval = r[i];
                    maxpos = i;
                    break;
                }
            }
            if (maxpos !== -1) {
                return sampleRate / maxpos;
            }
            return -1;
        }
    </script>
</body>
</html>
