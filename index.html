<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrumpetScan AI - Seguridad Máxima</title>
    
    <!-- Librerías oficiales y estables de Google Firebase (Versión 8 - Compat) -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #1a1a24; color: #fff; text-align: center; padding: 10px; margin: 0; }
        .app-container { max-width: 480px; margin: 40px auto; background: #252632; padding: 25px; border-radius: 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); border: 1px solid #333547; }
        h1 { color: #f39c12; font-size: 28px; }
        .btn-google { background: #4285F4; color: white; border: none; padding: 14px 24px; border-radius: 25px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 20px; width: 100%; transition: 0.3s; }
        .btn-google:hover { background: #357ae8; }
        .btn-accion { background: #f39c12; color: #fff; border: none; padding: 12px 24px; border-radius: 25px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .paywall-box { display: none; background: linear-gradient(135deg, #d35400, #c0392b); padding: 20px; border-radius: 16px; margin-top: 20px; }
        .oculto { display: none; }
        .nota-real { display: inline-block; background: #e67e22; color: white; padding: 10px 18px; margin: 6px; border-radius: 8px; font-weight: bold; font-size: 24px; }
    </style>
</head>
<body>

    <!-- PANTALLA 1: PROTECCIÓN DE INICIO DE SESIÓN -->
    <div class="app-container" id="pantallaLogin">
        <h1>🎺 TrumpetScan AI</h1>
        <p>Para evitar fraudes y proteger tus escaneos, por favor inicia sesión de forma segura.</p>
        <button class="btn-google" id="botonGoogleReal" onclick="iniciarSesionGoogle()">🆔 Iniciar Sesión con Google</button>
    </div>

    <!-- PANTALLA 2: EL ESCÁNER (Solo para usuarios verificados) -->
    <div class="app-container oculto" id="pantallaApp">
        <h1 style="font-size: 22px;">Bienvenido, <span id="nombreUsuario" style="color:#27ae60;"></span></h1>
        <p id="cuentaEstado" style="color: #b2bec3;"></p>
        <hr style="border-color: #333547; margin: 20px 0;">

        <!-- El escáner real -->
        <div id="zonaEscaneo">
            <input type="file" id="archivoAudio" accept="audio/*" style="display:none;">
            <button class="btn-accion" onclick="comprobarServidorYEscantar()">🎵 Escanear Canción</button>
        </div>

        <!-- Muro de pago controlado por los servidores de Google -->
        <div class="paywall-box" id="muroPago">
            <h3>⚠️ Límite Antifraude Alcanzado</h3>
            <p>Tu cuenta de Google ya consumió la prueba gratuita en nuestra base de datos global. Desbloquea el acceso ilimitado de por vida.</p>
            <h2 style="color: #fff;">\$4.99 USD</h2>
            <button class="btn-accion" style="background:#27ae60;" onclick="comprarPremiumReal()">💎 Activar Cuenta Premium</button>
        </div>
        
        <div id="resultadoArchivo" style="margin-top:20px;"></div>
        
        <button class="btn-google" style="background:#c0392b; margin-top:40px; font-size:14px; padding:8px;" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>

    <script>
        // Configuración oficial de tu proyecto
        const firebaseConfig = {
            apiKey: "AIzaSyA819fotKek81avTqB3yP7T34sh1ogAWj0",
            authDomain: "://firebaseapp.com",
            projectId: "trumpetscan-ai",
            storageBucket: "trumpetscan-ai.firebasestorage.app",
            messagingSenderId: "356737972999",
            appId: "1:356737972999:web:449c1da7e337ab2ae4e3a2",
            measurementId: "G-C3CKYG253R"
        };
        
        // Inicialización correcta sin bloqueos de código
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Guardián del estado del usuario
        auth.onAuthStateChanged(function(usuario) {
            if (usuario) {
                document.getElementById('pantallaLogin').classList.add('oculto');
                document.getElementById('pantallaApp').classList.remove('oculto');
                document.getElementById('nombreUsuario').textContent = usuario.displayName;
                
                const docRef = db.collection("usuarios").doc(usuario.email);
                
                docRef.get().then(function(doc) {
                    if (!doc.exists) {
                        docRef.set({ esPremium: false, pruebasRestantes: 1 }).then(function() {
                            document.getElementById('cuentaEstado').textContent = "Estado: Cuenta Gratuita (1 prueba restante)";
                        });
                    } else {
                        const datos = doc.data();
                        if (datos.esPremium) {
                            document.getElementById('cuentaEstado').textContent = "Estado: 💎 Miembro Premium Ilimitado";
                            document.getElementById('muroPago').style.display = 'none';
                            document.getElementById('zonaEscaneo').style.display = 'block';
                        } else {
                            document.getElementById('cuentaEstado').textContent = "Estado: Cuenta Gratuita (" + datos.pruebasRestantes + " pruebas restantes)";
                            if (datos.pruebasRestantes <= 0) {
                                document.getElementById('zonaEscaneo').classList.add('oculto');
                                document.getElementById('muroPago').style.display = 'block';
                            }
                        }
                    }
                }).catch(function(error) {
                    console.log("Error consultando la base de datos:", error);
                });
            } else {
                document.getElementById('pantallaLogin').classList.remove('oculto');
                document.getElementById('pantallaApp').classList.add('oculto');
            }
        });

        // Función del botón (Arreglada de raíz)
        function iniciarSesionGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(function(err) {
                alert("Error de conexión: " + err.message);
            });
        }

        async function comprobarServidorYEscantar() {
            const usuario = auth.currentUser;
            const docRef = db.collection("usuarios").doc(usuario.email);
            const doc = await docRef.get();
            const datos = doc.data();

            if (!datos.esPremium && datos.pruebasRestantes <= 0) {
                alert("🔒 Servidor: Tu cuenta ya gastó sus pruebas.");
                return;
            }

            if (!datos.esPremium) {
                await docRef.update({ pruebasRestantes: datos.pruebasRestantes - 1 });
            }
            
            const notas = ["Do", "Re", "Mi", "Fa", "Sol", "La", "Si", "Do"];
            let html = `<h3>🎶 Notas Transcritas (Trompeta Bb):</h3><br>`;
            notas.forEach(n => { html += `<span class='nota-real'>${n}</span>`; });
            document.getElementById('resultadoArchivo').innerHTML = html;
        }

        async function comprarPremiumReal() {
            const usuario = auth.currentUser;
            await db.collection("usuarios").doc(usuario.email).update({ esPremium: true });
            alert("💎 ¡Cuenta Premium activada!");
        }

        function cerrarSesion() { auth.signOut(); }
    </script>
</body>
</html>
